# Registers honeywatch's own k8s/ manifests Image Updater resolves new semver
# dashboard tags and writes the resolved tag back to k8s/kustomization.yaml
# in the honeywatch repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: honeywatch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/straightchlorine/honeywatch.git
    path: k8s
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: honeywatch
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
