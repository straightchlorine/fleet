apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hetzner-apps
  namespace: argocd
  annotations:
    # this file is inside the path it syncs, so the root manages itself
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://codeberg.org/piotrkrzysztof/fleet.git
    path: apps/hetzner
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    # failed auto-sync not retried for the same commit,
    # later waves would wait for the next push.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
