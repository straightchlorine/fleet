apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # The upstream release manifest carries fields the API server defaults or
    # drops (empty args/env lists, the serviceAccount alias, probe defaults), so
    # client-side diff reports permanent drift. Server-side diff compares with
    # apply semantics instead. Remove this annotation to revert.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    # The SealedSecret CRD and controller must exist before any App ships one
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://codeberg.org/piotrkrzysztof/fleet.git
    path: clusters/hetzner/sealed-secrets
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
  # The upstream release manifest declares fields the API server defaults, drops
  # or mirrors, and the live object still carries a stale last-applied-configuration.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: sealed-secrets-controller
      namespace: kube-system
      jqPathExpressions:
        - .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
        - .spec.template.spec.serviceAccount
        - .spec.template.spec.containers[].args
        - .spec.template.spec.containers[].env
        - .spec.template.spec.imagePullSecrets
        - .spec.template.spec.initContainers
