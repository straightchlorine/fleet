apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # The upstream release manifest carries fields the API server defaults or
    # drops (empty args/env lists, the serviceAccount alias, probe defaults), so
    # client-side diff reports permanent drift. Server-side diff compares with
    # apply semantics instead. Remove this annotation to revert.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://codeberg.org/piotrkrzysztof/fleet.git
    path: clusters/hetzner/sealed-secrets
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
