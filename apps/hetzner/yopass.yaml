apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yopass
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://codeberg.org/piotrkrzysztof/fleet.git
    path: clusters/hetzner/yopass
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: yopass
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
