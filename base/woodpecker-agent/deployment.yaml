apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodpecker-agent
  namespace: woodpecker
  labels:
    app: woodpecker-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: woodpecker-agent
  template:
    metadata:
      labels:
        app: woodpecker-agent
    spec:
      serviceAccountName: woodpecker-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 999
        supplementalGroups: [999]
      containers:
        - name: agent
          image: woodpeckerci/woodpecker-agent:v3.18.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: agent
              containerPort: 3000
              protocol: TCP
          env:
            - name: KUBERNETES_SERVICE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            - name: WOODPECKER_SERVER
              value: "woodpecker-server.woodpecker.svc.cluster.local:9000"
            - name: WOODPECKER_AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: woodpecker-agent-secret
                  key: agent-secret
            - name: WOODPECKER_GRPC_SECURE
              value: "false"
            - name: WOODPECKER_AGENT_LABELS
              value: "type=kubernetes,docker=true"
            - name: WOODPECKER_MAX_WORKFLOWS
              value: "1"
            - name: WOODPECKER_LOG_LEVEL
              value: "info"
            - name: WOODPECKER_BACKEND_K8S_STORAGE_RWX
              value: "false"
            - name: WOODPECKER_BACKEND_K8S_VOLUME_SIZE
              value: "1Gi"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
              readOnly: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            privileged: false
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ps aux | grep '[w]oodpecker-agent' > /dev/null
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
