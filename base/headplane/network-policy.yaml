apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headplane-netpol
  namespace: headscale
  labels:
    app: headplane
spec:
  podSelector:
    matchLabels:
      app: headplane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Traefik ingress controller
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # To headscale API (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app: headscale
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 50443
