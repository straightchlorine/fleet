apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-netpol
  namespace: observability
  labels:
    app: loki
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Push from Alloy
    - from:
        - podSelector:
            matchLabels:
              app: alloy
      ports:
        - protocol: TCP
          port: 3100
    # Push over the tailnet from the OCI node and the honeypot.
    # (from hetzner/.../nodeport-loki.yaml -> ACL tag:cluster-oci, tag:honeypot -> :30310)
    #
    # NOTE: Service uses externalTrafficPolicy: Local, so the source address
    # survives the NodePort hop. CIDR match ensures those calls are only from
    # within the tailnet.
    #
    # Since for now Loki has auth disabled (auth_enabled: false), this rule is
    # what keeps a public client off the NodePort. NOTE: for now ipv6 is not
    # used by any peers thus not yet considered.
    #
    # Since NodePort is open on every interface of the node, then the public one
    # is included. Without it a public client reaches the port exactly like tailnet
    # peer does.
    - from:
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - protocol: TCP
          port: 3100
    # Query from Grafana
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3100
    # Health checks from gatus
    - from:
        - namespaceSelector:
            matchLabels:
              name: gatus
          podSelector:
            matchLabels:
              app: gatus
      ports:
        - protocol: TCP
          port: 3100
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
