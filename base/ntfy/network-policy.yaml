apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ntfy-netpol
  namespace: ntfy
  labels:
    app: ntfy
spec:
  podSelector:
    matchLabels:
      app: ntfy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Traefik ingress controller
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
    # Allow health checks from gatus
    - from:
        - namespaceSelector:
            matchLabels:
              name: gatus
          podSelector:
            matchLabels:
              app: gatus
      ports:
        - protocol: TCP
          port: 80
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # External HTTPS (for webhooks/upstream notifications)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
