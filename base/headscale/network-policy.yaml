apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headscale-netpol
  namespace: headscale
  labels:
    app: headscale
spec:
  podSelector:
    matchLabels:
      app: headscale
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Traefik ingress controller (public API + noise protocol)
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # Allow from headplane in same namespace (API + gRPC)
    - from:
        - podSelector:
            matchLabels:
              app: headplane
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 50443
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # External HTTPS (DERP servers, update checks)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
