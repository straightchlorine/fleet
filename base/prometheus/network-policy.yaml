apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-netpol
  namespace: observability
  labels:
    app: prometheus
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Queries from Grafana
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
    # Remote-write over the tailnet from the OCI node and the honeypot.
    # (from hetzner/.../nodeport-prometheus.yaml -> ACL tag:cluster-oci, tag:honeypot -> :30090)
    #
    # NOTE: Service uses externalTrafficPolicy: Local, so the source address
    # survives the NodePort hop. CIDR match ensures those calls are only from
    # within the tailnet.
    #
    # Prometheus takes any series it is handed (--web.enable-remote-write-receiver)
    # and this path carries no basic auth, so this rule is what keeps a public
    # client off the NodePort. NOTE: for now ipv6 is not used by any peers thus
    # not yet considered.
    - from:
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - protocol: TCP
          port: 9090
    # Health checks from gatus
    - from:
        - namespaceSelector:
            matchLabels:
              name: gatus
          podSelector:
            matchLabels:
              app: gatus
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Target discovery talks to the API server, which has no pod selector to
    # match - it is reached on the host network.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
    # The kubelet's embedded cAdvisor (job kubelet-cadvisor). Like the API
    # server above it is on the host network, so there is no selector to match;
    # the port is the scope, which keeps the node's address out of the repo.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 10250
    # Scraping annotated pods:
    # the port is per-target, so it cannot be enumerated here.
    #
    # Scoped to in-cluster destinations only, which also covers
    # the node-exporter DaemonSet in `observability` - it is not
    # hostNetwork, so the scrape is pod-to-pod traffic.
    - to:
        - namespaceSelector: {}
