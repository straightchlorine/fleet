apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatus-netpol
  namespace: gatus
  labels:
    app: gatus
spec:
  podSelector:
    matchLabels:
      app: gatus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Traefik ingress controller
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # External HTTPS (ntfy alerting via public URL)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Internal: woodpecker-server health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: woodpecker
          podSelector:
            matchLabels:
              app: woodpecker-server
      ports:
        - protocol: TCP
          port: 8000
    # Internal: ntfy health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: ntfy
          podSelector:
            matchLabels:
              app: ntfy
      ports:
        - protocol: TCP
          port: 80
    # Internal: headscale health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: headscale
          podSelector:
            matchLabels:
              app: headscale
      ports:
        - protocol: TCP
          port: 8080
    # Internal: headplane health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: headscale
          podSelector:
            matchLabels:
              app: headplane
      ports:
        - protocol: TCP
          port: 3000
    # Internal: yopass health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: yopass
          podSelector:
            matchLabels:
              app: yopass
      ports:
        - protocol: TCP
          port: 1337
    # Internal: grafana health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: observability
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3000
    # Internal: loki health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: observability
          podSelector:
            matchLabels:
              app: loki
      ports:
        - protocol: TCP
          port: 3100
    # Internal: honeywatch dashboard health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: honeywatch
          podSelector:
            matchLabels:
              app: dashboard
      ports:
        - protocol: TCP
          port: 80
    # Internal: honeywatch API (via tailscale egress) health check
    - to:
        - namespaceSelector:
            matchLabels:
              name: honeywatch
          podSelector:
            matchLabels:
              app: honeywatch-egress
      ports:
        - protocol: TCP
          port: 5000
