# One-shot bootstrap applied manually via kubectl; see docs/oci-bootstrap.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - argocd-manager.yaml
  # sealed-secrets: independent keypair per cluster, version-matched with base/sealed-secrets
  - https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.3/controller.yaml
  # local-path-provisioner: rke2 ships no default StorageClass; this repo's PVCs assume `local-path`
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.27/deploy/local-path-storage.yaml
