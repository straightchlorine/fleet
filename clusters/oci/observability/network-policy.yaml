apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-netpol
  namespace: observability
  labels:
    app: alloy
spec:
  podSelector:
    matchLabels:
      app: alloy
  policyTypes:
    - Ingress
    - Egress
  # Nothing in this cluster talks to Alloy; its UI and probe port stay on the pod.
  # NOTE: the agent runs hostNetwork, and Calico does not police host-network
  # traffic, so this policy no longer gates the agent's own pushes. It is kept for
  # the day the agent moves back into the pod network; the live gates are the
  # headscale ACL and the node firewall.
  ingress: []
  egress:
    # DNS - pointing an endpoint at a name later won't fail in a way that might
    # look like a tailnet problem.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Telemetry out over the tailnet.
    - to:
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - protocol: TCP
          port: 30090
        - protocol: TCP
          port: 30310
