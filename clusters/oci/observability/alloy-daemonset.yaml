# Telemetry DaemonSet for the OCI rke2 cluster.
#
# Runs as root with hostPath mounts because it needs to read the host's
# journal, /proc, /sys and root filesystem requires; the `observability`
# namespace is labelled pod-security.kubernetes.io/enforce=privileged for this
# purpose.
#
# No ServiceAccount/RBAC: nothing touches Kubernetes API.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: observability
  labels:
    app: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      # hostNetwork on purpose: the node's pod egress is broken (firewalld drops
      # forwarded traffic on this rke2/Rocky node), while the host's own egress
      # works. It also makes /proc the host's, so the node collectors read real
      # data instead of the pod's namespaces.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        # SELinux (Rocky) refuses container_t access to the host's var_log_t and
        # init_t files, so the journal, pod-log and /proc reads all fail EACCES.
        # spc_t is the type privileged pods get; this namespace is privileged.
        seLinuxOptions:
          type: spc_t
      containers:
        - name: alloy
          image: grafana/alloy:v1.21.2
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            # positions and the remote_write WAL
            # Not persistent across pod replacement!
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --cluster.enabled=false
            - --disable-reporting
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
              readOnly: true
            # Writable scratch for positions + the remote_write WAL, so the
            # container's own root filesystem can stay read-only.
            - name: storage
              mountPath: /tmp
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            # The journal reader derives the machine directory from this file.
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            # Volatile journals live here; the reader uses /var/log/journal and
            # /run/log/journal when no path is set, and this node is volatile.
            - name: run-journal
              mountPath: /run/log/journal
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: storage
          emptyDir: {}
        - name: journal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
        - name: run-journal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
