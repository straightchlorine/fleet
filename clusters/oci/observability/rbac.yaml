apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
  labels:
    app: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-wke-pods
  namespace: wke
  labels:
    app: alloy
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-wke-pods
  namespace: wke
  labels:
    app: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-wke-pods
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
