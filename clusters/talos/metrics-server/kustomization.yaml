apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

patches:
  # ponytail: Talos kubelet serving certs aren't signed by a CA
  # metrics-server trusts by default, so the default config fails TLS
  # verification against the kubelet. --kubelet-insecure-tls is the
  # documented workaround for Talos (single-node, no external CA chain).
  - target:
      kind: Deployment
      name: metrics-server
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
