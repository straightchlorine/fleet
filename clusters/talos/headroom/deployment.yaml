apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: headroom
  labels:
    app: headroom
spec:
  replicas: 2  # HA; fits within node budget
  strategy:
    # Recreate took both pods down on every rollout, which is the one thing
    # 2 replicas can protect against on a single node. RWO PVC is fine here:
    # access is per-node, and every pod lands on the same node.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      securityContext:
        fsGroup: 1000  # Matches nonroot uid; enables PVC access
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Install [code] fresh per restart (no registry yet); revisit with custom image
        - name: install-code-extra
          image: ghcr.io/headroomlabs-ai/headroom:main-nonroot
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000  # Image's USER is the name "nonroot"; kubelet needs it numeric to verify
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command: ["pip", "install", "--no-cache-dir", "--target=/packages", "headroom-ai[code]"]
          volumeMounts:
            - name: code-extra
              mountPath: /packages
      containers:
        - name: headroom
          image: ghcr.io/headroomlabs-ai/headroom:main-nonroot
          imagePullPolicy: Always
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8787"
            - --code-aware
          env:
            - name: HEADROOM_TELEMETRY
              value: "on"
            - name: HEADROOM_WORKSPACE_DIR
              value: /state/.headroom
            # SubPath mount bug on this node; use path inside /state instead
            - name: HF_HOME
              value: /state/hf-cache
            - name: PYTHONPATH
              value: /packages
            # Tailnet ACL gated; no app-level token
            - name: HEADROOM_OUTPUT_SHAPER
              value: "1"
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          volumeMounts:
            - name: state
              mountPath: /state
            - name: code-extra
              mountPath: /packages
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5  # ~100s; don't kill the pod over a transient stall
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3  # ~30s tolerance; matches shorter liveness window
          resources:
            requests:
              cpu: 500m       # Reserve real capacity; compression is CPU-bound
              memory: 512Mi   # Cold start minimum
            limits:
              # Container sees nproc=4 and sizes its worker pool for it, so a
              # sub-core cap means constant CFS throttling (was 500m: 80% of
              # periods throttled, 18s stalls, liveness kills). 2x1500m leaves
              # ~950m of the node's 3950m for the control plane.
              cpu: 1500m
              memory: 1536Mi  # HF cache (~600Mi) + compression buffers
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: headroom-state
        - name: code-extra
          emptyDir: {}
