apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: headroom
  labels:
    app: headroom
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Install [code] fresh per restart (no registry yet)
        - name: install-code-extra
          image: ghcr.io/headroomlabs-ai/headroom:main-nonroot
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Install into a venv layered on the image's packages.
          # To ensure correct resolution and avoid shadowing via PYTHONPATH.
          command: ["sh", "-c", "python -m venv --system-site-packages /packages/venv && /packages/venv/bin/pip install --no-cache-dir headroom-ai[code]"]
          volumeMounts:
            - name: code-extra
              mountPath: /packages
      containers:
        - name: headroom
          image: ghcr.io/headroomlabs-ai/headroom:main-nonroot
          imagePullPolicy: Always
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8787"
            - --code-aware
          env:
            - name: HEADROOM_TELEMETRY
              value: "on"
            - name: HEADROOM_WORKSPACE_DIR
              value: /state/.headroom
            - name: HF_HOME
              value: /state/hf-cache
            - name: PYTHONPATH
              value: /packages/venv/lib/python3.13/site-packages
            - name: HEADROOM_OUTPUT_SHAPER
              value: "1"
            - name: ORT_DISABLE_TELEMETRY
              value: "1"
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          volumeMounts:
            - name: state
              mountPath: /state
            - name: code-extra
              mountPath: /packages
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              # Container sizes worker pool to nproc=4. Sub-core cap caused
              # throttling (for 500m 80% of periods throttled).
              #
              # 1500m and 2x2000m replicas still showed between 5 to 23%
              # of periods throttled.
              #
              # Single replica now - for now the most in the node.
              # TODO: Now performance monitored in grafana - check in the
              # cadvisor graphs whether we can maybe decrease this.
              cpu: 3000m
              # OOMs happened almost always after ~4 minutes after startup.
              # HF cache and model load are suspected causes, since it happened
              # independently of the request load.
              #
              # Currently CPU is the thight resource - allowing more memory for
              # this node.
              memory: 3072Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: headroom-state
        - name: code-extra
          emptyDir: {}
