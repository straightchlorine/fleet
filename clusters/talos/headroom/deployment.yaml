apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: headroom
  labels:
    app: headroom
spec:
  replicas: 1
  # RollingUpdate risks two headroom processes sharing one workspace.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headroom
          image: ghcr.io/headroomlabs-ai/headroom:main-code-nonroot@sha256:28dd23b6d64805e6b8da6dcb4e19ceedf989acee8cab5270ae2b3a9f01eaa0f0
          imagePullPolicy: IfNotPresent
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8787"
            - --code-aware
          env:
            - name: HEADROOM_TELEMETRY
              value: "on"
            - name: HEADROOM_WORKSPACE_DIR
              value: /state/.headroom
            - name: HF_HOME
              value: /state/hf-cache
            # Sterring is siabled. Nothing is shaped or written to
            # output_svings.json. Kept in case mode ever changes.
            - name: HEADROOM_OUTPUT_SHAPER
              value: "1"
            # Anonymous usage beacon opted out.
            - name: HEADROOM_BEACON
              value: "off"
            - name: ORT_DISABLE_TELEMETRY
              value: "1"
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          volumeMounts:
            - name: state
              mountPath: /state
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              # Container sizes worker pool to nproc=4. Sub-core cap caused
              # throttling (for 500m 80% of periods throttled).
              #
              # 1500m and 2x2000m replicas still showed between 5 to 23%
              # of periods throttled.
              #
              # 3000m works fine for the CM4.
              cpu: 3000m
              # OOMs happened almost always after ~4 minutes after startup.
              # HF cache and model load are suspected causes, since it happened
              # independently of the request load.
              #
              # Currently CPU is the thight resource - allowing more memory for
              # this node.
              memory: 3072Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: headroom-state
