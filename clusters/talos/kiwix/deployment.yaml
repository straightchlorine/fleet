apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwix
  namespace: kiwix
  labels:
    app: kiwix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kiwix
  template:
    metadata:
      labels:
        app: kiwix
    spec:
      containers:
        # Mounts the NAS share into the shared nas volume when the NAS is up.
        # Otherwise retries quietly in the background while kiwix serves local
        # zims only.
        - name: nas-mounter
          image: docker.io/library/alpine:3.20
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache nfs-utils
              while :; do
                if mount -t nfs -o ro,vers=4.2,soft,timeo=50,retry=0,proto=tcp \
                    truenas.codex.home.arpa:/mnt/tank/kiwix /mnt/nas; then
                  echo "NAS mounted"
                  break
                fi
                sleep 60
              done
              sleep infinity
          volumeMounts:
            - name: nas
              mountPath: /mnt/nas
              mountPropagation: Bidirectional
        - name: kiwix-serve
          image: ghcr.io/kiwix/kiwix-serve:3.7.0-2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            # Serves a library.xml rebuilt whenever the zim list on either mount
            # changes; --monitorLibrary reloads it. NAS coming back or a new
            # zim-fetch file shows up within ~60s, no pod restart.
            - |
              lib=/tmp/library.xml
              # A zim on both mounts is one book; the last one added wins, so local goes last.
              zims() { for d in /data/nas /data/local; do find "$d" -maxdepth 1 -iname '*.zim' 2>/dev/null | sort; done; }
              build() {
                rm -f "$lib.new"
                for z in $1; do kiwix-manage "$lib.new" add "$z"; done
                # kiwix-serve refuses a missing library file; start empty instead
                [ -f "$lib.new" ] || echo '<library version="20110515"/>' > "$lib.new"
                mv "$lib.new" "$lib"
              }
              seen=$(zims); build "$seen"
              (
                while sleep 60; do
                  now=$(zims)
                  [ "$now" = "$seen" ] && continue
                  echo "zim list changed, rebuilding library"
                  build "$now"; seen=$now
                done
              ) &
              exec kiwix-serve --port=8080 --monitorLibrary --library "$lib"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            # no readOnly here: the propagated NFS mount must attach cleanly, and the
            # sidecar mounts the share ro anyway (see its mount options)
            - name: nas
              mountPath: /data/nas
              mountPropagation: HostToContainer
            - name: zim-local
              mountPath: /data/local
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: nas
          emptyDir: {}
        - name: zim-local
          persistentVolumeClaim:
            claimName: kiwix-local-zim
