        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # noVNC/xterm.js console streams over a websocket - without this
        # upgrade handling nginx proxies it as a plain HTTP request, which
        # never completes the console's handshake (regular API/UI traffic
        # works fine either way, since $http_upgrade is empty for those).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_proxmox_euler;
        proxy_buffering off;
        proxy_read_timeout 86400s;
      }
    }
