apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: reverse-proxy
data:
  # Sorts first in conf.d so it wins default-server selection, and says so
  # explicitly. Without this an unknown hostname silently lands on whichever
  # block happens to sort first, which looked like a routing bug.
  00-default.conf: |
    server {
      listen 8443 ssl default_server;
      server_name _;

      ssl_certificate /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers HIGH:!aNULL:!MD5;

      location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location / {
        default_type text/plain;
        return 404 "no server block for this hostname\n";
      }
    }
  headroom.conf: |
    server {
      listen 8443 ssl;
      server_name headroom.internal.codextechnologies.org;

      ssl_certificate /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 10m;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers HIGH:!aNULL:!MD5;
      resolver 10.96.0.10 valid=10s;

      location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location / {
        set $upstream_headroom headroom.headroom.svc.cluster.local;
        proxy_pass http://$upstream_headroom:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
      }
    }
