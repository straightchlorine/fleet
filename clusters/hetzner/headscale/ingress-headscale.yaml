apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale
  namespace: headscale
  labels:
    app: headscale
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    # Critical: prevent Traefik from killing long-lived Noise protocol connections
    traefik.ingress.kubernetes.io/router.transport.respondingTimeouts.readTimeout: "0"
    traefik.ingress.kubernetes.io/router.transport.respondingTimeouts.writeTimeout: "0"
    traefik.ingress.kubernetes.io/router.transport.respondingTimeouts.idleTimeout: "600s"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vpn.codextechnologies.org
      secretName: headscale-tls
  rules:
    - host: vpn.codextechnologies.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 80
