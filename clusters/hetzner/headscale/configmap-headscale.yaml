apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
  labels:
    app: headscale
data:
  config.yaml: |
    server_url: https://vpn.codextechnologies.org
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v6: fd7a:115c:a1e0::/48
      v4: 100.64.0.0/10

    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h

    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite

    dns:
      magic_dns: true
      base_domain: codex.internal
      override_local_dns: false

      # Both zones are authoritative on the OPNsense Unbound, reachable at its
      # tailnet address, so a tailnet client resolves them the same way a LAN
      # client does (the LAN client just reaches that same Unbound through its
      # own resolvers). Only tailnet clients receive this block - MagicDNS hands
      # it to them; LAN clients never see it.
      nameservers:
        split:
          internal.codextechnologies.org:
          # - 192.168.20.10 if pihole would be preferred
            - 100.64.0.4
          codex.home.arpa:
          # - 192.168.20.10 if pihole would be preferred
            - 100.64.0.4

    policy:
      mode: file
      path: /etc/headscale/acl.hujson

    log:
      level: info

    logtail:
      enabled: false
  acl.hujson: |
    {
      "groups": {
        "group:admins": ["piotrkrzysztof@"],
        "group:ci":     ["ci@"],
        "group:cpi":    ["cpi@"],
      },

      "tagOwners": {
        "tag:admin":             ["group:admins"],
        "tag:honeypot":          ["group:admins"],
        "tag:honeywatch-egress": ["group:admins"],
        // Preauth key tags server-applied; client advertise-tags rejected.
        "tag:cicd":              ["group:ci"],
        "tag:ansible-controller": ["group:admins"],
        "tag:router":            ["group:admins"],
        // Rocky/Debian nodes for multicluster ArgoCD and SSH.
        "tag:cluster-hetzner":   ["group:admins"],
        "tag:cluster-oci":       ["group:admins"],
      },

      "acls": [
        {
          "action": "accept",
          "src": ["group:admins", "tag:admin"],
          "dst": ["*:*"],
        },

        // Honeywatch egress pod -> honeypot API only (no ssh).
        {
          "action": "accept",
          "src": ["tag:honeywatch-egress"],
          "dst": ["tag:honeypot:5000"],
        },

        // Ephemeral GitHub Actions runners -> honeypot deploy SSH only.
        {
          "action": "accept",
          "src": ["tag:cicd"],
          "dst": ["tag:honeypot:2022"],
        },

        // Ansible controller -> honeypot admin SSH only.
        {
          "action": "accept",
          "src": ["tag:ansible-controller"],
          "dst": ["tag:honeypot:2022"],
        },

        // The router can talk to other tag:router nodes
        {
          "action": "accept",
          "src": ["tag:router"],
          "dst": ["tag:router:*"],
        },

        // ArgoCD on Hetzner reaches the OCI rke2 API server over tailnet.
        {
          "action": "accept",
          "src": ["tag:cluster-hetzner"],
          "dst": ["tag:cluster-oci:6443"],
        },

        // Woodpecker OCI arm64 agent reaches the Hetzner gRPC NodePort.
        {
          "action": "accept",
          "src": ["tag:cluster-oci"],
          "dst": ["tag:cluster-hetzner:30900"],
        },

        // OCI node and honeypot host telemetry reach the Hetzner observability
        // stack. Prometheus remote-write and the Loki push path.
        // (nodeport-prometheus.yaml and nodeport-loki.yaml)
        //
        // No credentials on either path. This ACL and the ingress rules
        // (network-policy.yaml on both sides) are the gate.
        {
          "action": "accept",
          "src": ["tag:cluster-oci", "tag:honeypot"],
          "dst": ["tag:cluster-hetzner:30090"],
        },
        {
          "action": "accept",
          "src": ["tag:cluster-oci", "tag:honeypot"],
          "dst": ["tag:cluster-hetzner:30310"],
        },

        // cpi mesh network.
        {
          "action": "accept",
          "src": ["group:cpi"],
          "dst": ["group:cpi:*"],
        },

        // cpi nodes resolve the internal zones on the OPNsense Unbound.
        //
        // NOTE: it's resolution, not names - services (once ready) still need to
        // be appended to a rule below.
        {
          "action": "accept",
          "src": ["group:cpi"],
          "dst": ["100.64.0.4:53"],
        },

        // cpi -> headroom NodePort 30878 via router's 192.168.20.0/24.
        {
          "action": "accept",
          "src": ["group:cpi"],
          "dst": ["192.168.20.30:30878"],
        },

      ],

      // Auto-approve subnet routes advertised by the home router.
      "autoApprovers": {
        "routes": {
          "192.168.100.0/24": ["tag:router"],
          "192.168.50.0/24": ["tag:router"],
          "192.168.20.0/24": ["tag:router"],
        },
      },
    }
