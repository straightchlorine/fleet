apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
  labels:
    app: headscale
data:
  config.yaml: |
    server_url: https://vpn.codextechnologies.org
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v6: fd7a:115c:a1e0::/48
      v4: 100.64.0.0/10

    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h

    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite

    dns:
      magic_dns: true
      base_domain: hs.internal
      nameservers:
        global:
          - 1.1.1.1
          - 8.8.8.8

    policy:
      mode: file
      path: /etc/headscale/acl.hujson

    log:
      level: info

    logtail:
      enabled: false

    randomize_client_port: false
  acl.hujson: |
    {
      // Headscale users referenced here must exist via `headscale users
      // create` and are written with an `@` suffix (headscale 0.24+
      // namespace syntax). Verify names with `headscale users list`.
      "groups": {
        // Human operators; full tailnet access.
        "group:admins": ["piotrkrzysztof@"],
        // Service account for GitHub Actions CI runners.
        "group:ci":     ["ci@"],
      },

      "tagOwners": {
        "tag:admin":             ["group:admins"],
        "tag:honeypot":          ["group:admins"],
        "tag:honeywatch-egress": ["group:admins"],
        // GitHub Actions ephemeral runners.
        // IMPORTANT: mint preauth keys with `--user <ci-id> --tags tag:cicd`
        // and do NOT pass `--advertise-tags` on the client -- headscale 0.28
        // rejects registrations that combine a tagged preauth key with a
        // matching client-side advertise. Server applies the tag from the
        // key automatically.
        "tag:cicd":              ["group:ci"],
        // Reserved for the home router (not joined yet). Declared here so
        // the tag is usable the moment the router connects.
        "tag:router":            ["group:admins"],
      },

      "acls": [
        // Admin devices (laptop, phone, etc.) get full tailnet access.
        {
          "action": "accept",
          "src": ["group:admins", "tag:admin"],
          "dst": ["*:*"],
        },

        // honeywatch egress pod may only reach the honeypot's API port.
        {
          "action": "accept",
          "src": ["tag:honeywatch-egress"],
          "dst": ["tag:honeypot:5000"],
        },

        // CI runners may only SSH into the honeypot -- nothing else.
        {
          "action": "accept",
          "src": ["tag:cicd"],
          "dst": ["tag:honeypot:22"],
        },

        // tag:router has no rules yet -- add when the router joins.
      ],
    }
