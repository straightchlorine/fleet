apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
  labels:
    app: headscale
data:
  config.yaml: |
    server_url: https://vpn.codextechnologies.org
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v6: fd7a:115c:a1e0::/48
      v4: 100.64.0.0/10

    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h

    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite

    dns:
      magic_dns: true
      base_domain: hs.internal
      nameservers:
        global:
          - 9.9.9.9
          - 149.112.112.112

    policy:
      mode: file
      path: /etc/headscale/acl.hujson

    log:
      level: info

    logtail:
      enabled: false

    randomize_client_port: false
  acl.hujson: |
    {
      // Traffic model -- four isolated lanes:
      //
      //   Lane 1  Admin     group:admins / tag:admin   ->  *:*
      //   Lane 2  Prod      tag:honeywatch-egress      ->  tag:honeypot:5000
      //   Lane 3  CI/CD     tag:cicd                   ->  tag:honeypot:2022
      //   Lane 4  Home      tag:router                 ->  tag:router:* (self only)
      //
      // Implicit deny blocks everything not listed. Lanes never cross
      // unless a rule explicitly bridges them.

      "groups": {
        "group:admins": ["piotrkrzysztof@"],
        "group:ci":     ["ci@"],
      },

      "tagOwners": {
        "tag:admin":             ["group:admins"],
        "tag:honeypot":          ["group:admins"],
        "tag:honeywatch-egress": ["group:admins"],
        "tag:cicd":              ["group:ci"],
        "tag:router":            ["group:admins"],
      },

      "acls": [
        // ---- Lane 1: Admin ----
        // Human operator devices get unrestricted tailnet access.
        // This includes reaching the home subnet once the router
        // advertises it (see autoApprovers below).
        {
          "action": "accept",
          "src": ["group:admins", "tag:admin"],
          "dst": ["*:*"],
        },

        // ---- Lane 2: Production ----
        // honeywatch egress pod -> honeypot API only. Cannot reach
        // admin SSH (2022), the cluster, or any other tailnet node.
        {
          "action": "accept",
          "src": ["tag:honeywatch-egress"],
          "dst": ["tag:honeypot:5000"],
        },

        // ---- Lane 3: CI/CD ----
        // Ephemeral GitHub Actions runners -> honeypot deploy SSH only.
        {
          "action": "accept",
          "src": ["tag:cicd"],
          "dst": ["tag:honeypot:2022"],
        },

        // ---- Lane 4: Home network ----
        // The router can talk to other tag:router nodes (mesh between
        // home sites if you add more routers later). It CANNOT reach
        // production infrastructure, the honeypot, or CI/CD.
        // Admin devices reach home via the Lane 1 wildcard above.
        {
          "action": "accept",
          "src": ["tag:router"],
          "dst": ["tag:router:*"],
        },
      ],

      // Auto-approve subnet routes advertised by the home router so
      // admin devices can reach the home LAN without manual approval.
      "autoApprovers": {
        "routes": {
          "192.168.100.0/24": ["tag:router"],
          "192.168.50.0/24": ["tag:router"],
          "192.168.20.0/24": ["tag:router"],
        },
      },
    }
