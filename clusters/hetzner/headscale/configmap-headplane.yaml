apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: headscale
  labels:
    app: headplane
data:
  config.yaml: |
    server:
      addr: 0.0.0.0:3000
      metrics: true

    database:
      type: sqlite
      sqlite:
        path: /var/lib/headplane/headplane.db

    auth:
      mode: apikey

    integration:
      headscale:
        config_path: /etc/headscale/config.yaml

    features:
      network_management: false
      machine_management: true
      user_management: true
      acl_management: true

    logging:
      level: info
      format: json
