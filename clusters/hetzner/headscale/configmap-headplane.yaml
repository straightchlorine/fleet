apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: headscale
  labels:
    app: headplane
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 3000
      cookie_secret: PLACEHOLDER_CHANGE_ME_32CHARS_MIN
      cookie_secure: true
      data_path: /var/lib/headplane

    headscale:
      url: http://headscale:80
      config_path: /etc/headscale/config.yaml
