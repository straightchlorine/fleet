apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus-cpi
  labels:
    app: gatus
data:
  config.yaml: |
    metrics: true
    concurrency: 8

    storage:
      type: sqlite
      path: /data/gatus.db
      caching: true
      maximum-number-of-results: 100
      maximum-number-of-events: 50

    ui:
      # Marka i teksty zgodne z serwisem c-pi.org (Grav, motyw Quark).
      title: "c-pi · status"
      description: "Status serwisu c-pi.org — bieżąca dostępność i działanie."
      header: "c · pi"
      logo: "https://c-pi.org/user/themes/quark/images/favicon.png"
      link: "https://c-pi.org"
      dashboard-heading: "Status serwisu"
      dashboard-subheading: "Bieżąca dostępność i działanie c-pi.org"
      default-sort-by: group
      dark-mode: false
      favicon:
        default: "https://c-pi.org/user/themes/quark/images/favicon.png"
        size16x16: "https://c-pi.org/user/themes/quark/images/favicon.png"
        size32x32: "https://c-pi.org/user/themes/quark/images/favicon.png"
      buttons:
        - name: "Strona główna"
          link: "https://c-pi.org"
        - name: "O nas"
          link: "https://c-pi.org/o-stronie"
        - name: "Oś czasu"
          link: "https://c-pi.org/os-czasu"
        - name: "Mapa"
          link: "https://c-pi.org/mapa"
        - name: "Tego dnia"
          link: "https://c-pi.org/tego-dnia"
        - name: "Tematy"
          link: "https://c-pi.org/tematy"
      # Motyw dopasowany do c-pi.org (Grav/Quark): akcent #3085ee,
      # tło #f7f9fb, tekst #242931, wtórny #667189, ramki #e7e9ed.
      # `!important` jest konieczne, bo /css/custom.css ładuje się
      # przed /css/app.css, który definiuje te same zmienne.
      custom-css: |
        :root {
          --background: 210 33% 98% !important;
          --foreground: 217 15% 17% !important;
          --card: 0 0% 100% !important;
          --card-foreground: 217 15% 17% !important;
          --popover: 0 0% 100% !important;
          --popover-foreground: 217 15% 17% !important;
          --primary: 213 85% 56% !important;
          --primary-foreground: 0 0% 100% !important;
          --secondary: 210 33% 96% !important;
          --secondary-foreground: 217 15% 27% !important;
          --muted: 210 33% 96% !important;
          --muted-foreground: 221 15% 47% !important;
          --accent: 213 90% 96% !important;
          --accent-foreground: 213 85% 42% !important;
          --destructive: 0 72% 51% !important;
          --destructive-foreground: 0 0% 100% !important;
          --border: 220 14% 92% !important;
          --input: 220 14% 92% !important;
          --ring: 213 85% 56% !important;
          --radius: 0.375rem !important;
        }
        :root.dark {
          --background: 217 20% 13% !important;
          --foreground: 210 20% 92% !important;
          --card: 217 19% 16% !important;
          --card-foreground: 210 20% 92% !important;
          --popover: 217 19% 16% !important;
          --popover-foreground: 210 20% 92% !important;
          --primary: 213 85% 56% !important;
          --primary-foreground: 0 0% 100% !important;
          --secondary: 217 16% 22% !important;
          --secondary-foreground: 210 20% 92% !important;
          --muted: 217 16% 22% !important;
          --muted-foreground: 215 16% 65% !important;
          --accent: 213 60% 24% !important;
          --accent-foreground: 210 20% 92% !important;
          --destructive: 0 63% 40% !important;
          --destructive-foreground: 210 20% 92% !important;
          --border: 217 16% 24% !important;
          --input: 217 16% 24% !important;
          --ring: 213 85% 56% !important;
        }
        body {
          font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

    endpoints:
      # Wpis(y) monitorowane na tej stronie; `group` to nagłówek sekcji.
      # Zduplikuj blok poniżej, aby dodać kolejne adresy.
      - name: c-pi.org
        group: historia
        url: https://c-pi.org/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
