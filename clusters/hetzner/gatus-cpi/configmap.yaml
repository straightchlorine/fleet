apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus-cpi
  labels:
    app: gatus
data:
  config.yaml: |
    metrics: true
    concurrency: 8

    storage:
      type: sqlite
      path: /data/gatus.db
      caching: true
      maximum-number-of-results: 100
      maximum-number-of-events: 50

    ui:
      title: "c-pi · status"
      description: "Status serwisu c-pi.org — bieżąca dostępność i działanie."
      header: "c · pi"
      logo: "https://c-pi.org/user/themes/cpi/images/favicon.png?v=2"
      link: "https://c-pi.org"
      dashboard-heading: "Status serwisu"
      dashboard-subheading: "Bieżąca dostępność i działanie c-pi.org"
      default-sort-by: group
      dark-mode: false
      favicon:
        default: "https://c-pi.org/user/themes/cpi/images/favicon.png?v=2"
        size16x16: "https://c-pi.org/user/themes/cpi/images/favicon.png?v=2"
        size32x32: "https://c-pi.org/user/themes/cpi/images/favicon.png?v=2"
      buttons:
        - name: "Strona główna"
          link: "https://c-pi.org"
        - name: "O nas"
          link: "https://c-pi.org/o-stronie"
        - name: "Oś czasu"
          link: "https://c-pi.org/os-czasu"
        - name: "Mapa"
          link: "https://c-pi.org/mapa"
        - name: "Tego dnia"
          link: "https://c-pi.org/tego-dnia"
        - name: "Tematy"
          link: "https://c-pi.org/tematy"
      custom-css: |
        /* tokens taken from c-pi.org: paper/ink/line, brand blue, 14px radius */
        :root {
          --background: 42 39% 94% !important;
          --foreground: 222 19% 14% !important;
          --card: 42 39% 94% !important;
          --card-foreground: 222 19% 14% !important;
          --popover: 42 39% 94% !important;
          --popover-foreground: 222 19% 14% !important;
          --primary: 217 69% 47% !important;
          --primary-foreground: 42 39% 94% !important;
          --secondary: 41 38% 89% !important;
          --secondary-foreground: 222 19% 14% !important;
          --muted: 41 38% 89% !important;
          --muted-foreground: 224 5% 41% !important;
          --accent: 41 38% 89% !important;
          --accent-foreground: 217 72% 36% !important;
          --destructive: 0 72% 51% !important;
          --destructive-foreground: 0 0% 100% !important;
          --border: 40 33% 84% !important;
          --input: 40 33% 84% !important;
          --ring: 217 69% 47% !important;
          --radius: 0.875rem !important;
        }
        :root.dark {
          --background: 220 14% 8% !important;
          --foreground: 41 37% 90% !important;
          --card: 218 15% 11% !important;
          --card-foreground: 41 37% 90% !important;
          --popover: 218 15% 11% !important;
          --popover-foreground: 41 37% 90% !important;
          --primary: 218 82% 71% !important;
          --primary-foreground: 220 14% 8% !important;
          --secondary: 217 13% 19% !important;
          --secondary-foreground: 41 37% 90% !important;
          --muted: 217 13% 19% !important;
          --muted-foreground: 45 6% 58% !important;
          --accent: 217 13% 19% !important;
          --accent-foreground: 41 37% 90% !important;
          --destructive: 0 63% 40% !important;
          --destructive-foreground: 41 37% 90% !important;
          --border: 217 13% 19% !important;
          --input: 217 13% 19% !important;
          --ring: 218 82% 71% !important;
        }
        body {
          font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

    endpoints:
      - name: c-pi.org
        group: Serwis
        url: https://c-pi.org/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
