# AppProject for WKE: its repository may deploy only into the wke namespace of
# the OCI cluster and creates no cluster-scoped resources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: wke
  namespace: argocd
spec:
  description: WKE manifests from its own repository, wke namespace on OCI only.
  sourceRepos:
    - https://github.com/straightchlorine/wke.git
  destinations:
    - name: oci
      namespace: wke
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
