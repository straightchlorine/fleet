# AppProject scoping ArgoCD's authority over the OCI cluster.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oci
  namespace: argocd
spec:
  description: Apps deployed to the OCI rke2 cluster over the tailnet.
  sourceRepos:
    - https://codeberg.org/piotrkrzysztof/fleet.git
  destinations:
    # Alloy Role and RoleBinding for pod discovery in wke come from fleet
    # (clusters/oci/observability)
    - name: oci
      namespace: wke
    - name: oci
      namespace: woodpecker
    # Telemetry agent for the OCI host
    - name: oci
      namespace: observability
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
