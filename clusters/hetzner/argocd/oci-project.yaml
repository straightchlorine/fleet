# AppProject scoping ArgoCD's authority over the OCI cluster.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oci
  namespace: argocd
spec:
  description: Apps deployed to the OCI rke2 cluster over the tailnet.
  sourceRepos:
    - https://codeberg.org/piotrkrzysztof/fleet.git
    # - https://codeberg.org/piotrkrzysztof/wikipedia-knowledge-explorer.git
  destinations:
    # - name: oci
    #   namespace: wke
    - name: oci
      namespace: woodpecker
    # Telemetry agent for the OCI host
    - name: oci
      namespace: observability
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
