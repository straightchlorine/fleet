apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/gatus
  - namespace.yaml
  - configmap.yaml
  - ingress.yaml
  - sealed-gatus-security.yaml

patches:
  # Use local-path storage on k3s
  - target:
      kind: PersistentVolumeClaim
      name: gatus-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
