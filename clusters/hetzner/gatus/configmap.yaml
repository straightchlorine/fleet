apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
  labels:
    app: gatus
data:
  config.yaml: |
    metrics: true
    concurrency: 5

    storage:
      type: sqlite
      path: /data/gatus.db
      caching: true
      maximum-number-of-results: 100
      maximum-number-of-events: 50

    security:
      basic:
        username: "${GATUS_SECURITY_BASIC_USERNAME}"
        password-bcrypt-base64: "${GATUS_SECURITY_BASIC_PASSWORD_BCRYPT}"

    ui:
      title: "Codex Status"
      header: "Codex Technologies"
      dashboard-heading: "Service Health"
      dashboard-subheading: "Real-time monitoring of infrastructure and services"
      link: "https://piotrkrzysztof.dev"
      default-sort-by: group
      dark-mode: true
      buttons:
        - name: "Blog"
          link: "https://piotrkrzysztof.dev"
        - name: "CI"
          link: "https://ci.codextechnologies.org"

    alerting:
      ntfy:
        url: http://ntfy.ntfy.svc.cluster.local
        topic: gatus-alerts
        priority: 4
        token: "${GATUS_NTFY_TOKEN}"
        default-alert:
          enabled: true
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    endpoints:
      - name: Woodpecker CI
        group: infrastructure
        url: http://woodpecker-server.woodpecker.svc.cluster.local/health
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: ntfy
        group: infrastructure
        url: http://ntfy.ntfy.svc.cluster.local/v1/health
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Headscale VPN
        group: infrastructure
        url: http://headscale.headscale.svc.cluster.local/health
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Headplane Admin
        group: infrastructure
        url: http://headplane.headscale.svc.cluster.local/
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == any(200, 302, 404)"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Blog
        group: external
        url: https://piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy
