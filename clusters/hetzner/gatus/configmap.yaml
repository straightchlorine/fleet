apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
  labels:
    app: gatus
data:
  config.yaml: |
    security:
      basic:
        username: "${GATUS_SECURITY_BASIC_USERNAME}"
        password-bcrypt-base64: "${GATUS_SECURITY_BASIC_PASSWORD_BCRYPT}"

    alerting:
      ntfy:
        url: https://ntfy.codextechnologies.org
        topic: gatus-alerts
        priority: 4
        token: "${GATUS_NTFY_TOKEN}"
        default-alert:
          enabled: true
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    endpoints:
      - name: Woodpecker CI
        group: infrastructure
        url: https://ci.codextechnologies.org/healthz
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: ntfy

      - name: ntfy
        group: infrastructure
        url: https://ntfy.codextechnologies.org/v1/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: ntfy
