apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
  labels:
    app: gatus
data:
  config.yaml: |
    metrics: true
    concurrency: 8  # Tuned to cluster load (8 parallel probes)

    storage:
      type: sqlite
      path: /data/gatus.db
      caching: true
      maximum-number-of-results: 100
      maximum-number-of-events: 50

    security:
      basic:
        username: "${GATUS_SECURITY_BASIC_USERNAME}"
        password-bcrypt-base64: "${GATUS_SECURITY_BASIC_PASSWORD_BCRYPT}"

    ui:
      title: "Codex Status"
      header: "Codex Technologies"
      dashboard-heading: "Service Health"
      dashboard-subheading: "Real-time monitoring of infrastructure and services"
      link: "https://piotrkrzysztof.dev"
      default-sort-by: group
      dark-mode: false
      # Palette and type taken from piotrkrzysztof.dev (parchment/brown, Cormorant Garamond).
      # Gatus themes via shadcn HSL variables, so overriding them restyles everything.
      custom-css: |
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');
        :root {
          --background: 37 39% 94%;
          --foreground: 31 34% 18%;
          --card: 37 39% 94%;
          --card-foreground: 31 34% 18%;
          --primary: 31 34% 18%;
          --primary-foreground: 37 39% 94%;
          --muted: 37 30% 90%;
          --muted-foreground: 32 20% 39%;
          --border: 36 25% 78%;
          --input: 36 25% 78%;
          --ring: 37 31% 38%;
          --radius: 0.25rem;
        }
        body { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.125rem; }
      buttons:
        - name: "Blog"
          link: "https://piotrkrzysztof.dev"
        - name: "CI"
          link: "https://ci.codextechnologies.org"

    alerting:
      ntfy:
        url: http://ntfy.ntfy.svc.cluster.local
        topic: gatus-alerts
        priority: 4
        token: "${GATUS_NTFY_TOKEN}"
        default-alert:
          enabled: true
          failure-threshold: 3  # Alert after 3 failures; resolve after 2 successes
          success-threshold: 2
          send-on-resolved: true

    endpoints:
      - name: Woodpecker CI
        group: infrastructure
        url: http://woodpecker-server.woodpecker.svc.cluster.local/health
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: ntfy
        group: infrastructure
        url: http://ntfy.ntfy.svc.cluster.local/v1/health
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Headscale VPN
        group: infrastructure
        url: http://headscale.headscale.svc.cluster.local/health
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Headplane Admin
        group: infrastructure
        url: http://headplane.headscale.svc.cluster.local/
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == any(200, 302, 404)"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Yopass
        group: infrastructure
        url: http://yopass.yopass.svc.cluster.local/
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Grafana
        group: infrastructure
        url: http://grafana.observability.svc.cluster.local/api/health
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Loki
        group: infrastructure
        url: http://loki.observability.svc.cluster.local:3100/ready
        interval: 60s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Blog
        group: external
        url: https://piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      - name: F1
        group: external
        url: https://f1.piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # Liveness: API up, no DB query.
      - name: Honeywatch API Liveness
        group: external
        url: http://honeypot-api.honeywatch.svc.cluster.local:5000/health
        interval: 30s
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"
          - "[BODY].status == ok"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      # Readiness: Postgres reachable (splits DB vs process failures).
      - name: Honeywatch API Readiness
        group: external
        url: http://honeypot-api.honeywatch.svc.cluster.local:5000/health/ready
        interval: 300s
        client:
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"
          - "[BODY].status == ready"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      # Data path + query latency; early-warning as sessions table grows.
      - name: Honeywatch API
        group: external
        url: http://honeypot-api.honeywatch.svc.cluster.local:5000/api/v1/stats/totals
        interval: 300s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
          - "[BODY].total_sessions >= 0"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      # Cache warmer for the folded sessions list.
      - name: Honeywatch Sessions Warm
        group: external
        url: http://honeypot-api.honeywatch.svc.cluster.local:5000/api/v1/sessions/?fold=true&sort=recent&per_page=1
        interval: 30s
        client:
          timeout: 25s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
          - "[BODY].meta.total >= 0"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      - name: Honeywatch Dashboard
        group: external
        url: http://dashboard.honeywatch.svc.cluster.local/
        interval: 120s
        client:
          timeout: 5s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: ntfy
        ui:
          hide-url: true

      # WKE probes (site + /api/v1/status) removed until the project exists; the
      # old definitions are in git history and will need rewriting anyway.

      - name: QP
        group: docs
        url: https://docs.qp.piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      - name: Colorgen
        group: docs
        url: https://docs.colorgen.piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      - name: ahttpdc
        group: docs
        url: https://docs.ahttpdc.piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      - name: FSGA
        group: docs
        url: https://docs.fsga.piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      - name: Honeywatch Docs
        group: docs
        url: https://docs.honeywatch.piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy
