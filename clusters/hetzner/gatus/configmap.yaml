apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
  labels:
    app: gatus
data:
  config.yaml: |
    security:
      basic:
        username: "${GATUS_SECURITY_BASIC_USERNAME}"
        password-bcrypt-base64: "${GATUS_SECURITY_BASIC_PASSWORD_BCRYPT}"

    alerting:
      ntfy:
        url: https://ntfy.codextechnologies.org
        topic: gatus-alerts
        priority: 4
        token: "${GATUS_NTFY_TOKEN}"
        default-alert:
          enabled: true
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    endpoints:
      - name: Woodpecker CI
        group: infrastructure
        url: http://woodpecker-server.woodpecker/healthz
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"
        alerts:
          - type: ntfy

      - name: ntfy
        group: infrastructure
        url: http://ntfy.ntfy/v1/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"
        alerts:
          - type: ntfy

      - name: Headscale VPN
        group: infrastructure
        url: http://headscale.headscale/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"
        alerts:
          - type: ntfy

      - name: Headplane Admin
        group: infrastructure
        url: http://headplane.headscale/
        interval: 60s
        conditions:
          - "[STATUS] == any(200, 302, 404)"
          - "[RESPONSE_TIME] < 1000"
        alerts:
          - type: ntfy

      - name: Blog
        group: external
        url: https://piotrkrzysztof.dev/
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy
