# Resolves new semver api, ml and web tags for the wke app.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: wke
  namespace: argocd
  annotations:
    # lets this sync in the same pass that installs the CRD
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  writeBackConfig:
    method: "git:secret:argocd/github-writeback"
    gitConfig:
      branch: master
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: wke
      images:
        - alias: api
          imageName: ghcr.io/straightchlorine/wke-api
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
        - alias: ml
          imageName: ghcr.io/straightchlorine/wke-ml
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
        - alias: web
          imageName: ghcr.io/straightchlorine/wke-web
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
