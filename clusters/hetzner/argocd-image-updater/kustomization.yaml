apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/v1.4.0/config/install.yaml
  - imageupdater-honeywatch.yaml
  - imageupdater-usher.yaml
# commit identity - using a bot set up for this purpose; additionally skips ci
patches:
  - target:
      kind: ConfigMap
      name: argocd-image-updater-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-image-updater-config
      data:
        git.user: codextech-bot
        git.email: codextech-bot@codextechnologies.org
        git.commit-signing-key: /app/ssh-keys/id_rsa
        git.commit-signing-method: ssh
        git.commit-sign-off: "true"
        git.commit-message-template: |
          chore(deploy): bump {{ .AppName }} images [skip ci]

          {{ range .AppChanges -}}
          {{ .Image }}: {{ .OldTag }} -> {{ .NewTag }}
          {{ end -}}
