# Image Updater 1.x is configured by ImageUpdater resources, not Application
# annotations. Resolves new semver dashboard tags for the honeywatch app and
# writes them back to k8s/kustomization.yaml in the honeywatch repo.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: honeywatch
  namespace: argocd
  annotations:
    # lets this sync in the same pass that installs the CRD
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  writeBackConfig:
    method: "git:secret:argocd/github-writeback"
    gitConfig:
      branch: master
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: honeywatch
      images:
        - alias: dashboard
          imageName: ghcr.io/straightchlorine/honeywatch/dashboard
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
