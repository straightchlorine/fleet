apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/postgres
  - backup-cronjob.yaml
  - sealed-postgres-credentials.yaml
  - sealed-woodpecker-db-init.yaml

configMapGenerator:
  - name: postgres-init
    namespace: databases
    files:
      - init-databases.sh

patches:
  # Use local-path storage class on k3s
  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path

  # Inject woodpecker DB credentials from secret into postgres container
  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WP_DB_USER
          valueFrom:
            secretKeyRef:
              name: woodpecker-db-init
              key: username
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: woodpecker-db-init
              key: password
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WP_DB_NAME
          valueFrom:
            secretKeyRef:
              name: woodpecker-db-init
              key: database
