apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/postgres
  - backup-cronjob.yaml

configMapGenerator:
  - name: postgres-init
    namespace: databases
    files:
      - init-databases.sql

patches:
  # Use local-path storage class on k3s
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
