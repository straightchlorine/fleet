apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: databases
  labels:
    app: postgres-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          initContainers:
            # Step 1: dump postgres
            - name: dump
              image: postgres:17.4-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eo pipefail
                  wget -qO /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
                  tar -xzf /tmp/age.tar.gz -C /tmp
                  export PATH="/tmp/age:$PATH"

                  TIMESTAMP=$(date +%Y-%m-%d_%H%M%S)
                  BACKUP_FILE="/scratch/all-databases-${TIMESTAMP}.sql.gz.age"

                  echo "Starting backup at ${TIMESTAMP}"
                  pg_dumpall -h postgres.databases.svc.cluster.local -U postgres \
                    | gzip \
                    | age -r "${AGE_PUBLIC_KEY}" \
                    > "${BACKUP_FILE}"

                  echo "Dump complete (encrypted)"
                  ls -lh /scratch/
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: superuser-password
                - name: AGE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-encryption
                      key: age-public-key
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          containers:
            # Step 2: upload to R2 + keep local copy
            - name: upload
              image: rclone/rclone:1.69
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Uploading to R2..."
                  rclone copy /scratch/ :s3:${R2_BUCKET}/hk3s/postgres/ \
                    --s3-provider=Cloudflare \
                    --s3-access-key-id="${R2_ACCESS_KEY}" \
                    --s3-secret-access-key="${R2_SECRET_KEY}" \
                    --s3-endpoint="${R2_ENDPOINT}" \
                    --s3-no-check-bucket

                  echo "Cleaning up remote backups older than 30 days..."
                  rclone delete :s3:${R2_BUCKET}/hk3s/postgres/ \
                    --s3-provider=Cloudflare \
                    --s3-access-key-id="${R2_ACCESS_KEY}" \
                    --s3-secret-access-key="${R2_SECRET_KEY}" \
                    --s3-endpoint="${R2_ENDPOINT}" \
                    --s3-no-check-bucket \
                    --min-age 30d

                  # Keep local copy (last 7 days)
                  cp /scratch/*.sql.gz.age /backups/
                  find /backups -name "*.sql.gz.age" -mtime +7 -delete

                  echo "Backup complete"
                  ls -lh /backups/
              env:
                - name: R2_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: access-key
                - name: R2_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: secret-key
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: endpoint
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: bucket
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
                  readOnly: true
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: scratch
              emptyDir: {}
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: databases
  labels:
    app: postgres-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
