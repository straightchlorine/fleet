# NodePort exposure of the Prometheus remote-write receiver for the OCI rke2
# and honeypot hosts; there is no public write path.
#
# Same externalTrafficPolicy: Local reasoning as nodeport-loki.yaml:
# preserves the tailnet source address so 100.64.0.0/10 can be admitted and nothing else.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-tailnet
  namespace: observability
  labels:
    app: prometheus
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
