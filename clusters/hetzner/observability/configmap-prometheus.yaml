apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 60s
      evaluation_interval: 60s
      external_labels:
        cluster: hetzner

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # The node Prometheus itself runs on (node-exporter-daemonset.yaml):
      # in-cluster pull over the Service, no tailnet and no agent involved.
      # The series are relabelled into the Alloy family (job integrations/unix)
      # so all three hosts share one entry in the Node Exporter Full "Job"
      # variable; the scrape job keeps its own name in the targets page.
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter.observability.svc.cluster.local:9100"]
            labels:
              cluster: hetzner
        metric_relabel_configs:
          - target_label: job
            replacement: integrations/unix
          - target_label: instance
            replacement: debian-k3s
          - source_labels: [__name__]
            regex: node_uname_info
            target_label: nodename
            replacement: debian-k3s

      # Opt-in pod scraping: a pod is only scraped if it asks to be, with
      # prometheus.io/scrape: "true" (and optionally prometheus.io/port and
      # prometheus.io/path). Nothing is collected by default.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # Per-container memory, CPU and OOM kills from the kubelet's embedded
      # cAdvisor (k3s and rke2 both ship it). Scraped straight from the kubelet
      # with this pod's token, which only needs nodes/metrics; going through the
      # API server's nodes/proxy would grant far more than reading metrics.
      # Allowlisted: cAdvisor emits several hundred series per container.
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true # the kubelet serves a self-signed certificate
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_(memory_working_set_bytes|memory_rss|spec_memory_limit_bytes|cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|oom_events_total|memory_failcnt|network_receive_bytes_total|network_transmit_bytes_total)
            action: keep
