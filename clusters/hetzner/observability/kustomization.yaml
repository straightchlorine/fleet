apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/loki
  - ../../../base/alloy
  - ../../../base/grafana
  - ../../../base/prometheus
  - kube-state-metrics
  - namespace.yaml
  - configmap-loki.yaml
  - configmap-alloy.yaml
  - configmap-grafana-datasources.yaml
  - sealed-grafana-admin.yaml
  - ingress-grafana.yaml
  - configmap-prometheus.yaml
  - middleware.yaml
  - sealed-loki-basic-auth.yaml
  - sealed-prometheus-basic-auth.yaml
  - ingress-loki.yaml
  - ingress-prometheus.yaml
  - nodeport-loki.yaml
  - nodeport-prometheus.yaml
  # Host metrics for this node, scraped in-cluster by the `node-exporter` job.
  - node-exporter-daemonset.yaml
  - node-exporter-service.yaml
# Future dashboard provisioning for a new project.
# configMapGenerator:
#   - name: wke-dashboard
#     namespace: observability
#     files:
#       - dashboards/wke.json
#     options:
#       labels:
#         grafana_dashboard: "1"
patches:
  # k3s lacks network storage; use node-local provisioner for Loki and Grafana
  - target:
      kind: PersistentVolumeClaim
      name: loki-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: PersistentVolumeClaim
      name: prometheus-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: PersistentVolumeClaim
      name: grafana-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
