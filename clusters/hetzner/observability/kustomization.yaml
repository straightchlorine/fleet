apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/loki
  - ../../../base/alloy
  - ../../../base/grafana
  - namespace.yaml
  - configmap-loki.yaml
  - configmap-alloy.yaml
  - configmap-grafana-datasources.yaml
  - sealed-grafana-admin.yaml
  - ingress-grafana.yaml

patches:
  # k3s lacks network storage; use node-local provisioner for Loki and Grafana
  - target:
      kind: PersistentVolumeClaim
      name: loki-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: PersistentVolumeClaim
      name: grafana-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
