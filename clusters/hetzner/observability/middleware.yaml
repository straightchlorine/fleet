apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-auth
  namespace: observability
spec:
  # Loki runs auth_enabled: false (that is multi-tenancy, not authentication),
  # so this middleware is the only thing standing between the internet and an
  # unauthenticated write endpoint.
  basicAuth:
    secret: loki-basic-auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prometheus-push-auth
  namespace: observability
spec:
  # --web.enable-remote-write-receiver accepts any series it is handed, so this
  # is the only gate on the write endpoint.
  basicAuth:
    secret: prometheus-basic-auth
