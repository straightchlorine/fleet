apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
  labels:
    app: ntfy
data:
  server.yml: |
    base-url: https://ntfy.codextechnologies.org
    listen-http: :80
    cache-file: /var/cache/ntfy/cache.db
    cache-duration: 12h
    auth-file: /var/cache/ntfy/user.db
    auth-default-access: deny-all
    enable-login: true
    enable-signup: false
    behind-proxy: true
    attachment-cache-dir: /var/cache/ntfy/attachments
    keepalive-interval: 45s
